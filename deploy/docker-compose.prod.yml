# Production stack for EditingPDF (ultra-lean default).
#
# Runs only the essential production services: Caddy (reverse proxy/TLS router)
# and Web (Next.js canvas editor).
#
# - No Rust or Go compilation needed during VPS deploy.
# - Memory bounded for 1GB VPS hosts.
# - Only Caddy publishes host port (default 5000).

name: openpdf

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  caddy:
    image: caddy:2-alpine
    <<: *default-restart
    ports:
      - "${HTTP_PUBLISH:-5000}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - openpdf-prod
    logging: *default-logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: editingpdf-web:latest
    <<: *default-restart
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=384
    networks:
      - openpdf-prod
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

volumes:
  caddy-data:
  caddy-config:

networks:
  openpdf-prod:
    driver: bridge
